<text x="77" y="353" class="title">Root agent · LoopAgent</text>
<text x="77" y="383" class="body">Model ↔ tools · context &amp; memory · execution budgets</text>
<text x="77" y="407" class="small">Anthropic / OpenAI / OpenAI-compatible APIs</text>
<path d="M511 422V454" class="flow"/>
