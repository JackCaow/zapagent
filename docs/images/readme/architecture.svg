<text x="74" y="659" class="title">Explore / plan</text>
<text x="74" y="689" class="body">Shared workspace view</text>
<text x="74" y="714" class="small">Returns findings to the parent</text>
<rect x="372" y="592" width="278" height="139" rx="14" fill="url(#active)" stroke="#6b9652" stroke-width="1.5"/>
