<text x="396" y="970" class="small">File changes are applied; child Git history stays private.</text>
<text x="52" y="804" class="label">WORKSPACE RULE</text>
<text x="52" y="839" class="body">Writing agents edit</text>
<text x="52" y="866" class="body">their own snapshots.</text>
<text x="52" y="908" class="small">Their changes reach the</text>
<text x="52" y="933" class="small">parent through the merge.</text>

