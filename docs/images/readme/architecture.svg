<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" aria-labelledby="title desc">
<title id="title">zapAgent: coordinate, isolate, observe</title>
<desc id="desc">The host drives AgentRuntime and the root model loop. The coordinator delegates read-only work to a shared view and writing work to private snapshots. Writing agents produce artifacts that pass an explicit merge gate with conflict and parent drift checks. Tools pass through policy and an execution broker; runtime metadata feeds the read-only Watch interface.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101814"/><stop offset="1" stop-color="#0c1015"/></linearGradient>
  <linearGradient id="active" x2="1" y2="1"><stop stop-color="#203521"/><stop offset="1" stop-color="#15231c"/></linearGradient>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#b8ed71" stroke-width="1.5"/></marker>
  <marker id="mutedArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#80958a" stroke-width="1.5"/></marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { fill:#f0f6ef; font-weight:650; font-size:23px; }
    .body { fill:#b1c1b7; font-size:19px; }
    .small { fill:#91a49a; font-size:17px; }
    .label { fill:#b8ed71; font-size:15px; font-weight:650; letter-spacing:2px; }
    .box { fill:#151e1b; stroke:#35483d; stroke-width:1.5; }
    .flow { fill:none; stroke:#b8ed71; stroke-width:2; marker-end:url(#arrow); }
    .event { fill:none; stroke:#80958a; stroke-width:1.5; stroke-dasharray:5 6; marker-end:url(#mutedArrow); }
  </style>
</defs>
<rect width="1440" height="1110" rx="24" fill="url(#bg)"/>
<text x="52" y="59" class="label">ZAPAGENT / ARCHITECTURE</text>
<text x="52" y="106" fill="#f0f6ef" font-size="36" font-weight="650">One task. Independent work. Visible progress.</text>
<text x="52" y="140" class="body">A shared runtime coordinates the work; private snapshots contain each writer's edits.</text>

