name: Bug report
description: Report a reproducible zapVM defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Use SECURITY.md.
  - type: input
    id: version
    attributes:
      label: zapVM version
      placeholder: Output of zapvm version
    validations:
      required: true
  - type: textarea
    id: host
    attributes:
      label: Host environment
      description: OS version, architecture, hypervisor, and relevant doctor output.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps with secrets and private paths removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private code, state disks, and sensitive logs.
          required: true
        - label: This is not a vulnerability report.
          required: true
