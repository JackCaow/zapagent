name: Build VM web assets

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zapvm/web/client/react/package-lock.json
      - run: npm ci
        working-directory: zapvm/web/client/react
      - run: npm run build
        working-directory: zapvm/web/client/react
      - uses: actions/upload-artifact@v4
        with:
          name: vm-web-assets
          path: zapvm/web/client/app/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
