name: CLI Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZAP_BUILDER_VERSION: 1.3.14

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.ZAP_BUILDER_VERSION }}
      - name: Validate version and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          bun scripts/check-release-version.ts
          git merge-base --is-ancestor HEAD origin/main
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun audit --audit-level=high
      - run: bun test --reporter dot
        env:
          ZAPCODE_DATA_DIR: ${{ runner.temp }}/zap-release-data
      - run: sh -n install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cli-notices
          path: |
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 7

  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: bun-linux-x64
            asset: zap-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: zap-linux-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            asset: zap-macos-x64
          - os: macos-15
            target: bun-darwin-arm64
            asset: zap-macos-arm64
          - os: windows-2025
            target: bun-windows-x64
            asset: zap-windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.ZAP_BUILDER_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Generate embedded resources and compile
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          bun run build:watch
          bun run build:node-proxy
          bun build --compile --target="$BUILD_TARGET" src/index.tsx --outfile "dist/$ASSET"
      - name: Ad-hoc sign macOS binary
        if: runner.os == 'macOS'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          codesign --force --sign - "dist/$ASSET"
          codesign --verify --strict "dist/$ASSET"
      - name: Smoke test the native binary and write checksum
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          expected=$(bun -p 'require("./package.json").version')
          actual=$("./dist/$ASSET" --version)
          test "$actual" = "zapAgent v$expected"
          "./dist/$ASSET" --help-headless
          bun scripts/write-release-checksum.ts "dist/$ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  npm-candidate:
    needs: [verify, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.ZAP_BUILDER_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build:watch && bun run build:node-proxy
      - run: bun run typecheck:npm
      - run: bun run pack:npm
      - uses: actions/download-artifact@v4
        with:
          name: cli-zap-linux-x64
          path: dist/native
      - name: Verify exact npm candidate
        env:
          ZAPAGENT_TEST_BINARY: dist/native/zap-linux-x64
        shell: bash
        run: |
          set -euo pipefail
          candidate="dist/npm/zapagent-$(bun -p 'require("./package.json").version').tgz"
          bun run verify:npm "$candidate"
          bun scripts/write-release-checksum.ts "$candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-npm
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, binaries, npm-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete asset set and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
          for asset in zap-linux-x64 zap-linux-arm64 zap-macos-x64 zap-macos-arm64 zap-windows-x64.exe "zapagent-${RELEASE_TAG#v}.tgz"; do
            test -s "$asset"
            sha256sum -c "$asset.sha256"
          done
          sha256sum zap-linux-x64 zap-linux-arm64 zap-macos-x64 zap-macos-arm64 zap-windows-x64.exe zapagent-*.tgz > SHA256SUMS
          # A fresh tag is required; existing published releases are never overwritten.
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease --latest=false); else args+=(--latest); fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG" "${args[@]}" ./*
