name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZAP_BUILDER_VERSION: 1.3.14

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: zapvm/go.mod
          cache: false
      - name: Scan Git history (redacted)
        run: go run github.com/zricethezav/gitleaks/v8@v8.24.3 git --log-opts="--all" --redact --no-banner .

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.ZAP_BUILDER_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: bun run typecheck

      - name: Dependency audit
        run: bun audit --audit-level=high

      - name: Test
        run: bun test --reporter dot
        env:
          ZAPCODE_DATA_DIR: ${{ runner.temp }}/zap-test-data

      - name: Build
        run: bun run build

  sandbox-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.ZAP_BUILDER_VERSION }}
      - name: Install dependencies and bubblewrap
        run: |
          bun install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Linux namespace acceptance
        run: bun test zapsdk/tests/execution/platform-sandbox.test.ts

  sandbox-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.ZAP_BUILDER_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Windows AppContainer acceptance
        run: bun test zapsdk/tests/execution/platform-sandbox.test.ts
      - name: Non-Git workspace isolation and recovery
        run: bun test zapsdk/tests/workspace/copy-workspace.test.ts
        env:
          ZAPCODE_DATA_DIR: ${{ runner.temp }}/zap-copy-test-data

  sandbox-macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.ZAP_BUILDER_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Native macOS sandbox and multi-agent regressions
        run: bun test zapsdk/tests/execution/workspace-runtime.test.ts zapsdk/tests/execution/sandbox-temporary-directory.test.ts zapsdk/tests/workspace/subagent-git-write.test.ts zapsdk/tests/coordinator
        env:
          ZAPCODE_DATA_DIR: ${{ runner.temp }}/zap-macos-test-data
